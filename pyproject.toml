[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-scorer-app"
version = "2.0.0"
description = "Production-grade AI/ML Resume Intelligence & ATS Scorer"
readme = "README.md"
authors = [
    { name = "shivrajpawar514-commits", email = "shivrajpawar514@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "spacy>=3.7.0",
    "pymupdf>=1.24.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "textstat>=0.7.3",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "pdfminer.six>=20231228",
    "PyPDF2>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
